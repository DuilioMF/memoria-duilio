name: Memoria Duilio - UI checks

on:
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/md-ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify JavaScript syntax
        run: node --check ui/app.js
      - name: Verify Control tab elements
        run: |
          grep -q 'data-tab="control"' ui/index.html
          grep -q 'id="controlProjects"' ui/index.html
          grep -q 'async function refreshControl' ui/app.js
      - name: Refuse privileged browser keys
        run: |
          if grep -Ein 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' ui/*.js; then
            echo "Privileged credential reference in UI"
            exit 1
          fi
