# Explicitly labeled GitHub-only first pilot. NO Trello/Supabase completion.
# Only a repo-owner-created issue with the exact title may trigger a paid agent call.
name: MD - First bounded GitHub issue pilot
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: md-first-issue-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  bounded-pilot:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == 'DuilioMF' &&
      github.event.issue.title == 'MD AUTOPILOT PILOT 20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
    env:
      MD_TASK_JSON: ${{ github.event.issue.body }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and safety regression tests
        run: |
          python -m py_compile scripts/md_proposal_worker.py
          python -m unittest discover -s tests -p 'test_md_proposal_worker.py' -v
      - name: Enforce exact manual-pilot scope and real correlation fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          import md_proposal_worker as worker
          task=json.loads(os.environ['MD_TASK_JSON'])
          assert task.get('pilot_marker') == 'md-first-real-proposal-20260928', 'wrong pilot marker'
          assert task.get('run_key', '').startswith('PILOT-'), 'never reuse a natural AUTO run key'
          assert task.get('card_url') == 'https://trello.com/c/E7ZOVRGE', 'wrong Trello reference'
          assert task.get('allowed_files') == ['docs/fase10-executor-github-actions.md'], 'pilot can only improve one tracked documentation file'
          worker.validate_task(task)
          print('Scoped GitHub pilot validated; NOT a daily MD queue claim.')
          PY
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo '::error::GitHub Actions secret OPENAI_API_KEY missing'
            exit 1
          fi
          QUEUE_ID=$(python -c 'import json,os; print(json.loads(os.environ["MD_TASK_JSON"])["queue_id"])')
          if gh pr list --state all --json body --limit 100 | jq -e --arg q "$QUEUE_ID" '[.[] | select((.body // "") | contains($q))] | length > 0' >/dev/null; then
            echo '::error::A review PR already exists for this pilot id; do not duplicate'
            exit 1
          fi
      - name: Agent generates only the allowlisted documentation proposal
        id: propose
        run: python scripts/md_proposal_worker.py
      - name: Check agent diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = 1
          test "$(git diff --name-only)" = 'docs/fase10-executor-github-actions.md'
      - name: Commit and open review-only pull request
        env:
          CARD_URL: ${{ steps.propose.outputs.card_url }}
          PILOT_ID: ${{ steps.propose.outputs.queue_id }}
          PILOT_RUN: ${{ steps.propose.outputs.run_key }}
          SUMMARY: ${{ steps.propose.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="md/first-pilot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git config user.name 'MD bounded proposal worker'
          git config user.email 'md-proposal-worker@users.noreply.github.com'
          git add -- docs/fase10-executor-github-actions.md
          git commit -m 'pilot(md): bounded AI documentation proposal for human review'
          git push origin "$BRANCH"
          BODY=$(printf 'PILOT ONLY - not evidence of the daily 08:00 execution loop.\n\nTrello: %s\nCorrelation-only pilot id: %s (NOT a claimed MD queue row)\nPilot run: %s\nSummary: %s\n\nDo not merge automatically, deploy, close Trello or record specialist success without actual CI + CE-1.\n' "$CARD_URL" "$PILOT_ID" "$PILOT_RUN" "$SUMMARY")
          gh pr create --base main --head "$BRANCH" --title 'MD: first bounded autonomous pilot (review-only)' --body "$BODY"
