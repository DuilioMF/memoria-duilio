# No secrets are ever printed or passed to untrusted PR code.
# Preflight applies only to PRs from branches within this repository.
name: MD private-key readiness preflight
on:
  pull_request:
    paths:
      - ".github/workflows/md-secrets-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      OPENAI_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - name: Confirm API key presence without printing it
        shell: bash
        run: |
          if [[ "$OPENAI_KEY_PRESENT" != "true" ]]; then
            echo "::error::Configure OPENAI_API_KEY in repo Actions secrets before activating MD code execution."
            exit 1
          fi
          echo "OPENAI_API_KEY is configured for this workflow (value never read or logged)."
